[tools]
bun = "1.4.3"
node = "24.22.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install workspace dependencies from bun.lock without resolving"
run = "bun install --frozen-lockfile"

[tasks."lint:ts"]
description = "Lint TypeScript with oxlint, type-aware, warnings denied"
run = "oxlint --deny-warnings packages apps scripts"

[tasks."lint:format"]
description = "Check formatting of source, Markdown, YAML and JSON with oxfmt"
run = "oxfmt --check ."

[tasks."lint:license"]
description = "Check every published package carries the root LICENSE"
run = '''
for d in packages/*/* apps/*; do
  cmp -s LICENSE "$d/LICENSE" || { echo "LICENSE out of sync in $d (fix: mise run fix)"; exit 1; }
done
'''

[tasks."lint:dead"]
description = "Audit unused files, exports, dependencies and import cycles with fallow"
run = "fallow audit"

[tasks.lint]
description = "Run every static check without writing files"
depends = ["lint:*"]

[tasks."fix:code"]
description = "Apply safe oxlint fixes and format with oxfmt"
run = ["oxlint --fix packages apps scripts", "oxfmt ."]

[tasks."fix:license"]
description = "Copy the root LICENSE into every published package"
run = '''
for d in packages/*/* apps/*; do
  cp LICENSE "$d/LICENSE"
done
'''

[tasks.fix]
description = "Apply every safe automatic fix"
depends = ["fix:*"]

[tasks.typecheck]
description = "Type-check the root scripts and every workspace"
run = ["tsc -p tsconfig.json --noEmit", "bun run --workspaces typecheck"]

[tasks.test]
description = "Run the vitest suite"
run = "vitest run"

[tasks.build]
description = "Build every published package and the CLI"
wait_for = ["lint", "typecheck", "test"]
run = '''
for d in packages/*/* apps/*; do
  (cd "$d" && bun run build) || exit 1
done
'''

[tasks."release:rewrite"]
description = "Replace workspace:* ranges in a package manifest with real versions"
usage = 'arg "<package_dir>" help="Package directory, e.g. packages/youtube/metadata"'
run = 'bun scripts/rewrite-workspace-deps.ts "$usage_package_dir"'

[tasks."release:publish"]
description = "Publish a package to npm with provenance"
usage = 'arg "<package_dir>" help="Package directory, e.g. packages/youtube/metadata"'
run = 'cd "$usage_package_dir" && npm publish --provenance --access public'

[tasks.check]
description = "Run lint, typecheck, test and build. This is the entry for CI and contributors"
depends = ["lint", "typecheck", "test", "build"]
