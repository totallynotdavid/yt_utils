name: release-video-processor

on:
  push:
    tags:
      - 'video-processor-v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: write
  deployments: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package_dir: packages/youtube/video-processor
      package_name: '@ytutils/video-processor'
      tag_prefix: 'video-processor-v'
