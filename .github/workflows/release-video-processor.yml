name: release-video-processor

on:
  push:
    tags:
      - 'video-processor-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package_dir: packages/youtube/video-processor
      package_name: '@ytutils/video-processor'
      tag_prefix: 'video-processor-v'
