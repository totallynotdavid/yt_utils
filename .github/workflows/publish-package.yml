name: publish-package

on:
  workflow_call:
    inputs:
      package_dir:
        required: true
        type: string
      package_name:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'totallynotdavid' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5

      - run: mise run install

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          prefix="${{ inputs.tag_prefix }}"
          if [[ "$tag" != "$prefix"* ]]; then
            echo "Tag $tag does not match expected prefix $prefix"
            exit 1
          fi
          version="${tag#$prefix}"
          if [[ -z "$version" ]]; then
            echo "Resolved version is empty"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Validate declared version matches tag
        shell: bash
        run: |
          pkg_version=$(node -p "require('./${{ inputs.package_dir }}/package.json').version")
          if [ "$pkg_version" != "${{ steps.version.outputs.value }}" ]; then
            echo "Version mismatch for ${{ inputs.package_name }}: tag=${{ steps.version.outputs.value }} package=$pkg_version"
            exit 1
          fi

      - name: Install media binaries for the video-chunker test suite
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - run: mise run check

      - name: Rewrite workspace dependency ranges
        run: mise run release:rewrite ${{ inputs.package_dir }}

      - name: Publish package
        run: mise run release:publish ${{ inputs.package_dir }}
