name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run check:code

  fallow:
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          sarif: false
          comment: false
          review-comments: false
