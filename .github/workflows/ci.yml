name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run check:code

  fallow:
    runs-on: ubuntu-latest
    needs: quality

    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pin to 3.4.2 to avoid the 3.5.0+ Action verifier bug
      # (fallow-rs/fallow#1905); bump when upstream ships a fix.
      - uses: fallow-rs/fallow@v2.104.0
        with:
          command: audit
          version: 3.4.2
          sarif: false
          comment: false
          review-comments: false
