name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install media binaries for the video-chunker test suite
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Verify every package builds
        run: bun run build:all
