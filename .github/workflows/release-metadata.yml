name: release-metadata

on:
  push:
    tags:
      - 'metadata-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package_dir: packages/youtube/metadata
      package_name: '@ytutils/metadata'
      tag_prefix: 'metadata-v'
