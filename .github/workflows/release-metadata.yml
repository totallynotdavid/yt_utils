name: release-metadata

on:
  push:
    tags:
      - 'metadata-v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: write
  deployments: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package_dir: packages/youtube/metadata
      package_name: '@ytutils/metadata'
      tag_prefix: 'metadata-v'
