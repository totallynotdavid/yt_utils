name: release-video-chunker-cli

on:
  push:
    tags:
      - 'video-chunker-cli-v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: write
  deployments: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package_dir: apps/video-chunker-cli
      package_name: '@ytutils/video-chunker-cli'
      tag_prefix: 'video-chunker-cli-v'
