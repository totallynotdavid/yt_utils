name: release-core

on:
  push:
    tags:
      - 'core-v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: write
  deployments: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package_dir: packages/shared/core
      package_name: '@ytutils/core'
      tag_prefix: 'core-v'
