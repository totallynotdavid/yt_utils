name: release-duration

on:
  push:
    tags:
      - 'duration-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package_dir: packages/duration
      package_name: '@ytutils/duration'
      tag_prefix: 'duration-v'
